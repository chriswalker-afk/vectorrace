name: Seven-circuit Glass Ice physics and browser quality gates

on:
  pull_request:
    paths:
      - 'race-v12.html'
      - 'src/circuit.mjs'
      - 'src/engine.mjs'
      - 'src/race-coach.mjs'
      - 'src/race-art-v12.mjs'
      - 'src/race-v12.mjs'
      - 'src/ux-smoke-v12.mjs'
      - 'styles/map-selector-v12.css'
      - 'styles/glass-ice-ui.css'
      - 'scripts/glass-ice-qa-route.mjs'
      - 'scripts/viewport-smoke-v12.mjs'
      - 'tests/glass-ice.test.mjs'
      - 'tests/biomes.test.mjs'
      - 'tests/twin-routes.test.mjs'
      - 'docs/TRACK_DIFFICULTY_ROADMAP.md'
      - '.github/workflows/seven-circuits.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  glass-ice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate zone rules, braking coach, full-lap solver and all previous circuits
        run: npm test
      - name: Syntax-check source, track art, UI and browser runner
        run: npm run check
      - name: Nine viewports, 24-turn Master lap and disabled-diagonal Glass Ice state
        run: |
          set -e
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/snowshift-glass-ice.log 2>&1 &
          sleep 2
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node scripts/viewport-smoke-v12.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snowshift-pr15-glass-ice-verified-previews
          path: screenshots/snowshift-v12-*.png
          if-no-files-found: warn
