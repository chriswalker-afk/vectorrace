name: Eleven-circuit Frozen Gauntlet combined physics and browser quality gates

on:
  pull_request:
    paths:
      - 'race-v16.html'
      - 'index.html'
      - 'src/circuit.mjs'
      - 'src/engine.mjs'
      - 'src/race-coach.mjs'
      - 'src/race-art-v16.mjs'
      - 'src/race-v16.mjs'
      - 'src/ux-smoke-v16.mjs'
      - 'scripts/frozen-gauntlet-qa-route.mjs'
      - 'scripts/viewport-smoke-v16.mjs'
      - 'styles/map-selector-v16.css'
      - 'styles/gauntlet-ui.css'
      - 'tests/frozen-gauntlet.test.mjs'
      - 'tests/biomes.test.mjs'
      - 'docs/PR19_FROZEN_GAUNTLET.md'
      - '.github/workflows/eleven-circuits.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coupled-gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All vector-physics, 24-turn safety, six-phase BFS and older-course tests
        run: npm test
      - name: Check V16 and previous build syntax
        run: npm run check
      - name: Nine viewports, 11-map selector, coupled Glass+Wind, Boost+Rock and real Master lap
        run: |
          set -e
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/snowshift-frozen-gauntlet.log 2>&1 &
          sleep 2
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node scripts/viewport-smoke-v16.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snowshift-pr19-frozen-gauntlet-screen-review
          path: screenshots/snowshift-v16-*.png
          if-no-files-found: warn
