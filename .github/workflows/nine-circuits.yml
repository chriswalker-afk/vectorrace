name: Nine-circuit Icebound Rapids boost physics and browser quality gates

on:
  pull_request:
    paths:
      - 'race-v14.html'
      - 'index.html'
      - 'src/circuit.mjs'
      - 'src/engine.mjs'
      - 'src/race-coach.mjs'
      - 'src/race-art-v14.mjs'
      - 'src/race-v14.mjs'
      - 'src/ux-smoke-v14.mjs'
      - 'styles/map-selector-v14.css'
      - 'styles/boost-ui.css'
      - 'scripts/icebound-rapids-qa-route.mjs'
      - 'scripts/viewport-smoke-v14.mjs'
      - 'tests/icebound-rapids.test.mjs'
      - 'tests/crosswind-ridge.test.mjs'
      - 'tests/biomes.test.mjs'
      - 'docs/TRACK_DIFFICULTY_ROADMAP.md'
      - 'docs/PR17_ICEBOUND_RAPIDS.md'
      - '.github/workflows/nine-circuits.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate nine courses, signed boost arithmetic and safe full lap
        run: npm test
      - name: Syntax-check every V14 module and browser QA file
        run: npm run check
      - name: Nine CSS viewports, both boost strips and actual Master lap
        run: |
          set -e
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/snowshift-rapids.log 2>&1 &
          sleep 2
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node scripts/viewport-smoke-v14.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snowshift-pr17-icebound-rapids-verified-screenshots
          path: screenshots/snowshift-v14-*.png
          if-no-files-found: warn
